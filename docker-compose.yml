services:
  postgres:
    image: postgres:16-alpine
    container_name: ttcc_postgres
    environment:
      POSTGRES_USER: ttcc_user
      POSTGRES_PASSWORD: ttcc_password
      POSTGRES_DB: ttcc_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ttcc_nextjs
    environment:
      - DATABASE_URL=postgresql://ttcc_user:ttcc_password@postgres:5432/ttcc_db?schema=public
      - NODE_ENV=production
      - PRIVATE_UPLOAD_DIR=/data/uploads
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost}
      - TRUST_PROXY=true
    expose:
      - "3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ttcc_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
