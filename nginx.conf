# Loaded in nginx http context by conf.d/default.conf.
limit_req_zone $binary_remote_addr zone=public_requests:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload_requests:10m rate=20r/m;
server {
    listen 80;
    server_name localhost;

    client_max_body_size 6m;
    # Sensitive legacy URLs are denied even during a rollback.
    location ^~ /uploads/ { return 404; }
    location = /api/upload {
        limit_req zone=upload_requests burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /search {
        limit_req zone=public_requests burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
